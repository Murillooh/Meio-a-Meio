<!doctype html>
<html lang="pt-BR" data-theme="escuro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0b" />
    <meta name="description" content="Reserva de emergência, contas e gastos da casa em um só lugar." />

    <!-- iOS standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meio a Meio" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="/splash.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Instrument+Serif&display=swap" />
    <script>
      // aplica o tema salvo antes da primeira pintura (evita flash)
      try {
        var t = localStorage.getItem('casa:tema');
        if (t === 'claro' || t === 'escuro') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>Meio a Meio</title>
  </head>
  <body>
    <div id="root">
      <!-- splash até o React montar -->
      <div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg,#1c1512)">
        <div style="width:56px;height:56px;border-radius:18px;background:#f0a06a;display:flex;align-items:center;justify-content:center;color:#2b1c15;font:700 24px/1 system-ui,sans-serif">C</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
