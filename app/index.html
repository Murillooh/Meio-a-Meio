<!doctype html>
<html lang="pt-BR" data-theme="escuro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0b" />
    <meta name="description" content="Reserva de emergência, contas e gastos da casa em um só lugar." />

    <!-- iOS standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meio a Meio" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="/splash.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Instrument+Serif&family=Fraunces:ital,wght@0,300;0,500;0,600;1,300;1,400&family=Inter:wght@400;500;600;700&display=swap" />
    <script>
      // aplica o tema salvo antes da primeira pintura (evita flash)
      try {
        var t = localStorage.getItem('casa:tema');
        if (!t && window.matchMedia) {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        }
        if (t === 'claro' || t === 'escuro') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>Meio a Meio</title>
  </head>
  <body>
    <div id="root">
      <!-- splash até o React montar -->
      <div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#0b0705;z-index:9999;overflow:hidden;">
        <!-- Aurora / Glows -->
        <div style="position:absolute;width:95vw;height:95vw;top:-28vw;left:-32vw;background:rgba(244,180,121,0.15);filter:blur(60px);border-radius:50%;animation:boot-pulse 8s ease-in-out infinite alternate;"></div>
        <div style="position:absolute;width:105vw;height:105vw;bottom:-38vw;right:-36vw;background:rgba(160,90,28,0.12);filter:blur(60px);border-radius:50%;animation:boot-pulse 12s ease-in-out infinite alternate-reverse;"></div>
        
        <!-- Logo -->
        <div style="position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;animation:boot-fade-in 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) both;">
          <!-- Badge -->
          <div style="position:relative;width:130px;height:130px;margin-bottom:32px;">
            <div style="position:absolute;inset:-10px;background:rgba(244,180,121,0.25);border-radius:50%;filter:blur(24px);"></div>
            <div style="position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#efc691;overflow:hidden;">
              <div style="position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,0.15) 0%,transparent 50%,transparent 100%);"></div>
              <img src="/logo-mam.png" alt="MaM" style="width:100%;height:100%;object-fit:cover;position:relative;z-index:2;border-radius:50%;transform:scale(1.03);" />
            </div>
          </div>
          
          <h1 style="font-family:'Fraunces',serif;font-weight:600;font-size:36px;letter-spacing:-0.5px;margin:0;background:linear-gradient(to bottom, #fffaf2, #efc691);-webkit-background-clip:text;-webkit-text-fill-color:transparent;color:transparent;">Meio a Meio</h1>
          
          <!-- Loading bar -->
          <div style="margin-top:40px;width:120px;height:2px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;position:relative;">
            <div style="position:absolute;top:0;left:0;height:100%;width:40%;background:linear-gradient(90deg, transparent, #efc691, transparent);animation:boot-shimmer 2s infinite ease-in-out;border-radius:4px;"></div>
          </div>
        </div>

        <style>
          @keyframes boot-fade-in {
            0% { opacity: 0; transform: translateY(12px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
          }
          @keyframes boot-pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.15); opacity: 1; }
          }
          @keyframes boot-shimmer {
            0% { transform: translateX(-150%); }
            100% { transform: translateX(250%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
