<!doctype html>
<html lang="pt-BR" data-theme="escuro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0b" />
    <meta name="description" content="Reserva de emergência, contas e gastos da casa em um só lugar." />

    <!-- iOS standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meio a Meio" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="/splash.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Instrument+Serif&family=Fraunces:ital,wght@0,300;0,500;0,600;1,300;1,400&family=Inter:wght@400;500;600;700&display=swap" />
    <script>
      // aplica o tema salvo antes da primeira pintura (evita flash)
      try {
        var t = localStorage.getItem('casa:tema');
        if (t === 'claro' || t === 'escuro') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>Meio a Meio</title>
  </head>
  <body>
    <div id="root">
      <!-- splash até o React montar -->
      <div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#f9f3ea;z-index:9999;">
        <img src="/splash-bg.png" alt="" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;" />
        <div style="position:absolute;bottom:3rem;left:50%;width:12rem;transform:translateX(-50%);overflow:hidden;border-radius:9999px;background-color:rgba(0,0,0,0.2);" id="boot-progress">
          <div style="height:0.375rem;width:50%;border-radius:9999px;background-color:#f0a06a;animation:boot-indeterminate 1.5s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes boot-indeterminate {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
          }
          @media (min-width: 768px) {
            #boot-progress { bottom: 5rem !important; width: 16rem !important; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
